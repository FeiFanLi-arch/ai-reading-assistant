services:
  reader:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    environment:
      AI_MODE: ${AI_MODE:-auto}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      APP_ACCESS_TOKEN: ${APP_ACCESS_TOKEN:-}
      DB_PATH: /app/data/reader.db
    volumes:
      - reader-data:/app/data
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  reader-data:
